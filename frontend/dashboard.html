<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Hostel - Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; /* warm off-white */
  --card:#FFFFFF;
  --border:#E5E7EB;
  --text:#1F2937;
  --muted:#6B7280;
  --primary:#D97706; /* terracotta */
  --primary-dark:#B45309;
  --accent:#F59E0B; /* amber */
  --success:#059669;
  --error:#DC2626;
  --shadow-sm:0 1px 3px rgba(0,0,0,.08);
  --shadow:0 4px 12px rgba(0,0,0,.08);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  display:flex;flex-direction:column;
}
header{
  background:var(--card);
  border-bottom:1px solid var(--border);
  padding:16px 24px;
  display:flex;align-items:center;justify-content:space-between;
  box-shadow:var(--shadow-sm);
}
.logo{display:flex;align-items:center;gap:10px}
.logo span{font-weight:700;font-size:18px;letter-spacing:.5px}
.logo::before{
  content:"";width:32px;height:32px;background:linear-gradient(135deg,var(--primary),var(--accent));
  border-radius:8px;display:inline-block;
}
.nav-btn{
  background:none;border:none;color:var(--muted);font-size:14px;cursor:pointer;
  padding:6px 10px;border-radius:6px;transition:background .2s,color .2s;
}
.nav-btn:hover{background:var(--border);color:var(--text)}
.nav-btn.active{color:var(--primary)}
main{flex:1;padding:24px;overflow-y:auto;}
.welcome{margin-bottom:28px}
.welcome h2{font-size:22px;font-weight:600;margin-bottom:6px}
.role-badge{
  display:inline-flex;align-items:center;gap:4px;
  background:rgba(217,119,6,.1);color:var(--primary);
  padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600;
}
.section{
  background:var(--card);
  border-radius:16px;
  border:1px solid var(--border);
  padding:24px;
  margin-bottom:24px;
  box-shadow:var(--shadow-sm);
}
.section h3{
  font-size:18px;font-weight:600;margin-bottom:16px;
  display:flex;align-items:center;gap:8px;
}
.section h3::before{
  content:"";width:4px;height:100%;background:var(--primary);border-radius:2px;
}
.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:16px;margin-bottom:24px;
}
.stat-card{
  background:rgba(217,119,6,.03);
  border:1px solid var(--border);
  border-radius:14px;
  padding:20px;
  text-align:center;
}
.stat-card h3{
  font-size:28px;font-weight:700;margin:8px 0 4px;
  color:var(--primary);
}
.stat-card p{
  font-size:14px;color:var(--muted);
}
.notice-item{
  background:rgba(217,119,6,.05);
  border-left:3px solid var(--primary);
  border-radius:0 8px 8px 0;
  padding:16px;
  margin-bottom:12px;
}
.notice-item h4{
  font-size:16px;font-weight:600;margin:0 0 8px 0;
  color:var(--text);
}
.notice-item p{
  font-size:14px;color:var(--muted);margin:0 0 8px 0;
}
.notice-item .date{
  font-size:12px;color:var(--muted);
}
.loading,.empty{
  text-align:center;color:var(--muted);padding:24px;
}
.btn-primary{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:white;font-weight:600;font-size:14px;cursor:pointer;
  transition:transform .05s;
}
.btn-primary:active{transform:translateY(1px)}
.btn-secondary{
  width:100%;padding:12px;border:none;border-radius:10px;
  background:rgba(217,119,6,.1);color:var(--primary);
  font-weight:600;font-size:14px;cursor:pointer;
}
.btn-secondary:hover{background:rgba(217,119,6,.2)}
.hidden{display:none}

/* Modal */
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;}
.modal.hidden{display:none !important;}
.modal-content{background:var(--card);border-radius:16px;padding:24px;width:90%;max-width:480px;box-shadow:var(--shadow);position:relative;}
.close-btn{position:absolute;top:12px;right:12px;background:none;border:none;font-size:24px;color:var(--muted);cursor:pointer;}
.close-btn:hover{color:var(--text);}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:14px;background:#fff;color:var(--text);}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(217,119,6,.15)}
.form-group textarea{resize:vertical;}
.message{text-align:center;margin-top:12px;font-size:13px}
.error{color:var(--error)}
.success{color:var(--success)}
</style>
</head>
<body>
<header class="logo">
  <span>Smart Hostel</span>
  <button class="nav-btn" id="logoutBtn" title="Logout">Logout</button>
</header>
<main>
  <div class="welcome">
    <h2>Welcome back!</h2>
    <span id="userName" class="role-badge">Loading...</span>
  </div>

  <!-- Admin Only Stats -->
  <div id="adminStats" class="stats-grid hidden">
    <div class="stat-card">
      <h3 id="totalRooms">0</h3>
      <p>Total Rooms</p>
    </div>
    <div class="stat-card">
      <h3 id="occupiedRooms">0</h3>
      <p>Occupied Rooms</p>
    </div>
    <div class="stat-card">
      <h3 id="pendingComplaints">0</h3>
      <p>Pending Complaints</p>
    </div>
    <div class="stat-card">
      <h3 id="totalStudents">0</h3>
      <p>Total Students</p>
    </div>
  </div>

  <!-- Notices Section (For Everyone) -->
  <section class="section">
    <h3>📢 Latest Notices & Announcements</h3>
    <div id="noticesList">
      <p class="loading">Loading notices...</p>
    </div>
  </section>

  <!-- Student Action: File Complaint -->
  <section id="studentActions" class="section hidden">
    <h3>🎫 Need Help?</h3>
    <p style="margin-bottom:1rem;color:var(--muted);">Having issues with your room or facilities?</p>
    <button class="btn-secondary" id="openComplaintModal">File a New Complaint</button>
  </section>
</main>

<!-- Complaint Modal -->
<div id="complaintModal" class="modal hidden">
  <div class="modal-content">
    <span class="close-btn" id="closeComplaintModal">&times;</span>
    <h2>File a Complaint</h2>
    <form id="complaintForm">
      <div class="form-group">
        <label for="complaintTitle">Title</label>
        <input type="text" id="complaintTitle" placeholder="Brief title of the issue" required>
      </div>
      <div class="form-group">
        <label for="complaintDescription">Description</label>
        <textarea id="complaintDescription" rows="4" placeholder="Describe the issue in detail" required></textarea>
      </div>
      <div class="form-group">
        <label for="complaintPriority">Priority</label>
        <select id="complaintPriority" required>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="form-group">
        <label for="complaintProof">Proof (Image)</label>
        <input type="file" id="complaintProof" accept="image/*">
        <small>Optional: Upload an image as proof (jpg, png)</small>
      </div>
      <button type="submit" class="btn-primary" id="submitComplaint">Submit Complaint</button>
      <div id="complaintMessage" class="message"></div>
    </form>
  </div>
</div>

<script>
const API_URL = "https://hotel-management-system-pd7b.onrender.com";

const token = localStorage.getItem('token');
const role = localStorage.getItem('role');
const userId = localStorage.getItem('userId');

if (!token) {
  window.location.href = 'index.html';
}

async function initDashboard() {
  try {
    const res = await fetch(`${API_URL}/auth/me`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) {
      localStorage.removeItem('token');
      localStorage.removeItem('role');
      localStorage.removeItem('userId');
      window.location.href = 'index.html';
      return;
    }
    const user = await res.json();

    document.getElementById('userName').textContent = (user.role || role || '').toUpperCase();
    document.querySelector('.logo').title = `Logged in as ${user.email}`;

    const currentRole = user.role || role;
    if (currentRole === 'admin') {
      document.getElementById('adminStats').classList.remove('hidden');
      fetchDashboardStats();
    } else {
      document.getElementById('studentActions').classList.remove('hidden');
    }

    fetchNotices();
  } catch (e) {
    console.error('Auth validation failed', e);
    localStorage.removeItem('token');
    localStorage.removeItem('role');
    localStorage.removeItem('userId');
    window.location.href = 'index.html';
  }
}

initDashboard();

async function fetchDashboardStats() {
  try {
    const response = await fetch(`${API_URL}/dashboard/stats`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (response.ok) {
      const data = await response.json();
      document.getElementById('totalRooms').textContent = data.total_rooms;
      document.getElementById('occupiedRooms').textContent = data.occupied_rooms;
      document.getElementById('pendingComplaints').textContent = data.pending_complaints;
      document.getElementById('totalStudents').textContent = data.total_students;
    }
  } catch (error) {
    console.error("Failed to fetch stats:", error);
  }
}

async function fetchNotices() {
  try {
    const response = await fetch(`${API_URL}/notices/`);
    const data = await response.json();
    const noticesList = document.getElementById('noticesList');
    noticesList.innerHTML = '';

    if (data.length === 0) {
      noticesList.innerHTML = '<p class="empty">No active notices at the moment.</p>';
      return;
    }

    data.forEach(notice => {
      const date = new Date(notice.created_at).toLocaleDateString();
      const pinnedBadge = notice.is_pinned ?
        '<span style="background:#ed8936;color:white;padding:2px 6px;border-radius:4px;font-size:0.7rem;margin-left:8px;">PINNED</span>' : '';

      const noticeHTML = `
        <div class="notice-item">
          <h4>${notice.title} ${pinnedBadge}</h4>
          <p>${notice.content}</p>
          <div class="date">Posted on: ${date}</div>
        </div>
      `;
      noticesList.innerHTML += noticeHTML;
    });
  } catch (error) {
    document.getElementById('noticesList').innerHTML = '<p class="empty" style="color:var(--error);">Failed to load notices.</p>';
    console.error("Failed to fetch notices:", error);
  }
}

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('token');
  localStorage.removeItem('role');
  localStorage.removeItem('userId');
  window.location.href = 'index.html';
});

// Complaint Modal Logic
const complaintModal = document.getElementById('complaintModal');
const openComplaintModal = document.getElementById('openComplaintModal');
const closeComplaintModal = document.getElementById('closeComplaintModal');
const complaintForm = document.getElementById('complaintForm');
const complaintMessage = document.getElementById('complaintMessage');

if (openComplaintModal) {
  openComplaintModal.addEventListener('click', () => {
    complaintModal.classList.remove('hidden');
  });
}
if (closeComplaintModal) {
  closeComplaintModal.addEventListener('click', () => {
    complaintModal.classList.add('hidden');
    complaintForm.reset();
    complaintMessage.textContent = '';
  });
}
window.addEventListener('click', (e) => {
  if (e.target === complaintModal) {
    complaintModal.classList.add('hidden');
    complaintForm.reset();
    complaintMessage.textContent = '';
  }
});

if (complaintForm) {
  complaintForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = document.getElementById('complaintTitle').value.trim();
    const description = document.getElementById('complaintDescription').value.trim();
    const prioritySelect = document.getElementById('complaintPriority');
    const priority = prioritySelect.value.charAt(0).toUpperCase() + prioritySelect.value.slice(1);
    const proofFile = document.getElementById('complaintProof').files[0];

    complaintMessage.textContent = "Submitting...";
    complaintMessage.className = "message";

    try {
      const complaintData = {
        title,
        description,
        priority,
        proof_image: null
      };

      const response = await fetch(`${API_URL}/complaints/`, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify(complaintData)
      });

      const data = await response.json();
      if (response.ok) {
        complaintMessage.textContent = "Complaint submitted successfully!";
        complaintMessage.className = "message success";
        complaintForm.reset();
        setTimeout(() => {
          complaintModal.classList.add('hidden');
        }, 1500);
      } else {
        complaintMessage.textContent = data.detail || "Submission failed";
        complaintMessage.className = "message error";
      }
    } catch (err) {
      complaintMessage.textContent = "Network error. Please try again.";
      complaintMessage.className = "message error";
      console.error("Complaint Error:", err);
    }
  });
}
// Close modal with Escape key
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !complaintModal.classList.contains('hidden')) {
    complaintModal.classList.add('hidden');
    complaintForm.reset();
    complaintMessage.textContent = '';
  }
});
</script>
</body>
</html>
