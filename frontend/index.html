<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Hostel — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;
  --surface:rgba(255,255,255,0.04);
  --surface-2:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.09);
  --text:#f4f4f5;
  --muted:#a1a1aa;
  --primary:#f59e0b;
  --primary-dark:#d97706;
  --accent-glow:rgba(245,158,11,0.35);
  --success:#34d399;
  --error:#f87171;
}
[data-theme="light"]{
  --bg:#fafaf9;
  --surface:rgba(255,255,255,0.75);
  --surface-2:#ffffff;
  --border:rgba(0,0,0,0.08);
  --text:#18181b;
  --muted:#71717a;
  --accent-glow:rgba(245,158,11,0.25);
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',system-ui,sans-serif}
body{
  min-height:100vh;
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:24px;position:relative;overflow:hidden;
  transition:background .4s ease,color .4s ease;
}
body::before{
  content:'';position:fixed;inset:0;
  background:
    radial-gradient(ellipse 70% 50% at 75% 15%, rgba(245,158,11,0.14), transparent),
    radial-gradient(ellipse 50% 40% at 15% 85%, rgba(251,191,36,0.10), transparent);
  pointer-events:none;
}
.theme-btn{
  position:fixed;top:20px;right:20px;z-index:10;
  width:42px;height:42px;border-radius:12px;
  background:var(--surface);border:1px solid var(--border);
  color:var(--muted);cursor:pointer;font-size:1.05rem;
  display:grid;place-items:center;transition:all .2s;
  backdrop-filter:blur(12px);
}
.theme-btn:hover{color:var(--primary);border-color:var(--primary);transform:translateY(-1px)}
.card{
  width:100%;max-width:420px;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:22px;
  padding:36px 32px;
  backdrop-filter:blur(20px);
  box-shadow:0 40px 80px rgba(0,0,0,0.35),0 0 0 1px rgba(245,158,11,0.06);
  position:relative;z-index:1;
  animation:slideUp .5s cubic-bezier(.34,1.3,.64,1) both;
}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.logo{
  width:48px;height:48px;border-radius:14px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:grid;place-items:center;color:#fff;
  font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:19px;
  box-shadow:0 0 24px var(--accent-glow),inset 0 1px 0 rgba(255,255,255,0.25);
}
h2{font-family:'Space Grotesk',sans-serif;color:var(--text);font-size:1.45rem;font-weight:700;letter-spacing:-0.02em}
.subtitle{color:var(--muted);font-size:.85rem;margin-top:4px}
.form-group{margin-bottom:18px}
label{display:block;font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:8px}
.input-wrap{position:relative}
input{
  width:100%;padding:13px 44px 13px 15px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:12px;font-size:.93rem;color:var(--text);
  transition:border-color .2s,box-shadow .2s;
}
input::placeholder{color:var(--muted);opacity:.6}
input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(245,158,11,0.15)}
.toggle{
  position:absolute;right:10px;top:50%;transform:translateY(-50%);
  background:none;border:none;cursor:pointer;color:var(--muted);
  padding:6px;border-radius:8px;transition:all .2s;font-size:.95rem;
}
.toggle:hover{color:var(--primary);background:var(--surface-2)}
.btn{
  width:100%;padding:14px;border:none;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  color:#fff;font-weight:700;font-size:.95rem;cursor:pointer;
  font-family:inherit;box-shadow:0 8px 24px rgba(217,119,6,0.3);
  transition:all .2s;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 12px 32px rgba(217,119,6,0.45)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.message{text-align:center;margin-top:14px;font-size:.85rem;font-weight:500;min-height:20px}
.error{color:var(--error)}
.success{color:var(--success)}
.link{text-align:center;margin-top:20px;font-size:.85rem;color:var(--muted)}
.link a{color:var(--primary);text-decoration:none;font-weight:600;transition:opacity .2s}
.link a:hover{opacity:.8}
.divider{height:1px;background:var(--border);margin:24px 0}
@keyframes slideUp{from{opacity:0;transform:translateY(24px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:480px){.card{padding:28px 22px}}
</style>
<base target="_blank">
</head>
<body>

<button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle theme">🌙</button>

<div class="card">
  <div class="brand">
    <div class="logo">SH</div>
    <div>
      <h2>Welcome back</h2>
      <div class="subtitle">Smart Hostel • Sign in to continue</div>
    </div>
  </div>
  <form id="loginForm">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="student@university.com" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
        <button type="button" class="toggle" id="togglePass" aria-label="Show password">👁️</button>
      </div>
    </div>
    <button type="submit" class="btn">Login</button>
    <div id="message" class="message"></div>
  </form>
  <div class="link">Don't have an account? <a href="register.html">Register here</a></div>
</div>

<script>
const API_URL = "https://hotel-management-system-pd7b.onrender.com";

// Theme
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeBtn').textContent = t==='light'?'🌙':'☀️';
  localStorage.setItem('theme',t);
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme')||'dark';
  applyTheme(cur==='dark'?'light':'dark');
}
applyTheme(localStorage.getItem('theme')||'dark');

const toggle = document.getElementById('togglePass');
const pwd = document.getElementById('password');
toggle.addEventListener('click', ()=>{
  const isPwd = pwd.type === 'password';
  pwd.type = isPwd ? 'text' : 'password';
  toggle.textContent = isPwd ? '🙈' : '👁️';
});

document.getElementById('loginForm').addEventListener('submit', async function(e){
  e.preventDefault();
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const messageDiv = document.getElementById('message');
  const submitBtn = document.querySelector('.btn');
  messageDiv.textContent = "Connecting to API...";
  messageDiv.className = "message";
  submitBtn.disabled = true;
  try{
    const response = await fetch(`${API_URL}/auth/login`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({email,password})
    });
    const data = await response.json();
    if(response.ok){
      localStorage.setItem('token', data.access_token);
      localStorage.setItem('role', data.role);
      localStorage.setItem('userId', data.user_id);
      messageDiv.textContent = "Login successful! Redirecting...";
      messageDiv.className = "message success";
      setTimeout(()=>{window.location.href='dashboard.html';},1000);
    }else{
      messageDiv.textContent = data.detail || "Login failed";
      messageDiv.className = "message error";
    }
  }catch(err){
    messageDiv.textContent = "Network error. Please try again.";
    messageDiv.className = "message error";
  }finally{
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
